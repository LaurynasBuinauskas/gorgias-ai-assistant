name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Panel + extension (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm -r test
      - run: pnpm build

  backend:
    name: Backend (.NET build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Copilot.slnx
      - run: dotnet build Copilot.slnx --no-restore --configuration Release
      - run: dotnet test Copilot.slnx --no-build --configuration Release
      # Proves every banned-text eval assertion can still fire against its own bad examples.
      # No secrets, no network, no model calls — cases and canaries only. Added after five
      # dead checks were found by accident in one day (see beta-progress, 2026-08-03).
      - run: dotnet run --project tools/Copilot.Evals --no-build --configuration Release -- --audit

  shell-e2e:
    # The shell runs inside someone else's page, which is the one thing a unit test cannot
    # honestly cover: whether an iframe lands in the right element, survives a SPA navigation
    # and is never rebuilt. Every origin it touches is intercepted, so nothing needs running.
    name: Extension shell (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @copilot/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @copilot/extension test:e2e

  redaction:
    # The rules that strip personal data out of ticket exemplars before they are indexed.
    # Every leak class in this suite was found by a person reading exchanges, not by an
    # automated check, and the decisions log calls this the load-bearing control for customer
    # data — but until now nothing ran it except someone remembering to. No secrets and no
    # network: it is fixtures against pure functions.
    name: Redaction rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ingest/test_redaction.py
