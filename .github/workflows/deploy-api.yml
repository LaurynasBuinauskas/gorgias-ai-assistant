name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Secrets/variables required (see docs/azure-setup.md):
#   secret AZURE_API_PUBLISH_PROFILE — App Service publish profile XML
#   var    AZURE_API_APP_NAME        — App Service name
# Runtime secrets (Gorgias/OpenAI keys) are NOT handled here: App Service reads them
# from Key Vault via its managed identity, so they never touch GitHub or this workflow.
jobs:
  deploy:
    name: Publish to Azure App Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # SourceRevisionId lands in AssemblyInformationalVersion, which /health reports — that
      # is what makes "is my change live yet?" answerable instead of guesswork.
      - run: >
          dotnet publish backend/Copilot.Api/Copilot.Api.csproj
          --configuration Release --output publish
          -p:SourceRevisionId=${{ github.sha }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: publish

      # A green deploy step only means the package was delivered. The previous build can
      # keep serving, or the running process can swap files under itself and start throwing
      # BadImageFormatException on routes it has not JITted yet — which happened, silently,
      # until /health existed. Gate on this commit actually serving.
      - name: Verify the deployed build is serving
        env:
          BASE: https://${{ vars.AZURE_API_APP_NAME }}.azurewebsites.net
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 20 "$BASE/health" 2>/dev/null || true)
            case "$body" in
              *"${{ github.sha }}"*)
                # /health deliberately bypasses rate limiting, so it stays up in the very
                # failure mode we are guarding against. Check a normal route as well.
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/v1/config")
                if [ "$code" = "200" ]; then
                  echo "Live and serving: $body"
                  exit 0
                fi
                echo "attempt $attempt: correct build, but /v1/config returned $code"
                ;;
              *) echo "attempt $attempt: previous build still serving" ;;
            esac
            sleep 10
          done
          echo "::error::Deployed build never served this commit. Restart the app: az webapp restart -g <rg> -n ${{ vars.AZURE_API_APP_NAME }}"
          exit 1
