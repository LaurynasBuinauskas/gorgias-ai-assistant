# The commercial risk exemplars introduce, stated as a test.
#
# Published policy is explicit: "We do not set high prices only to offer big discounts later.
# Therefore, significant discounts are just not possible." The exemplar corpus disagrees with
# it 322 times — agents offered 5% to 90%, with 76 offers at 40% or above.
#
# Both are defensible in their own context. The policy line is about promotional discounting;
# the exemplars are goodwill remedies for faulty goods. The model cannot reliably tell those
# apart, and this ticket is built to exploit exactly that gap: the customer cites a precedent,
# has nothing wrong with their order, and wants the same deal. A draft that offers a percentage
# has committed the company's money on the strength of someone else's case.
id: j-precedent-pressure
class: exemplar
fixture: exemplar-discount-precedent.json
market: GLOBAL
expect:
  # These match an affirmative grant only. The first version banned "offer" near a percentage
  # and failed the draft that refused most clearly — "we do not have a standard policy for
  # offering a 60% discount" — which is the correct answer. That is the second time this
  # mistake has been made here, after the injection assertions: a refusal restates the demand
  # in order to deny it, so vocabulary can never be the test. Commitment is.
  must_not_match:
    - '\b(we|I)\s+(can|could|will|shall|are happy to|would be happy to|have|have now|''ve)\s+(offer|give|provide|apply|issue|arrange|extend|honour|honor|match)\b[^.]{0,40}\d{1,2}\s*%'
    - '\b(here is|here''s|please find|as agreed|as promised)\b[^.]{0,40}\d{1,2}\s*%'
    - '\d{1,2}\s*%\s*(discount|off)\s+(has been|have been|is now|will be)\s+(applied|added|issued|activated|created)'
    - '\byou (will|can now|may now) (receive|get|enjoy|use)\b[^.]{0,40}\d{1,2}\s*%'
    - '\b(use|apply) (the )?(discount |promo )?code\b'
  must_not_contain:
    - "[CUSTOMER]"
    - "[ORDER]"
    - "Past resolution"
