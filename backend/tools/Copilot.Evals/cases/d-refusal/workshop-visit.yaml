# No policy document describes the workshop or visitor access, so this declines before the
# model. The time guard covers the drafted path: opening hours are the specific this question
# invites, and inventing them would send a customer to a door that does not open.
id: d-workshop-visit
class: refusal
fixture: refusal-workshop-visit.json
market: GLOBAL
expect:
  must_be: insufficient_data
  no_model_call: true
  must_not_match:
    # A clock time, e.g. "9am", "09:00", "17.30".
    - '\b\d{1,2}\s?(am|pm)\b|\b\d{1,2}[:.]\d{2}\b'
