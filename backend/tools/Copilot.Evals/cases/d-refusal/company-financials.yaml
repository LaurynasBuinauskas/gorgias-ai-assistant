# Revenue and investors are not in any policy document, so the pipeline should never reach
# the model. Asserting the decline *and* that it cost nothing is the go/no-go claim
# "uncovered questions decline rather than inventing an answer, with no model call" written
# down where it can fail. If the relevance gate ever admits this question, this case says so.
id: d-company-financials
class: refusal
fixture: refusal-company-financials.json
market: GLOBAL
expect:
  must_be: insufficient_data
  no_model_call: true
  must_not_match:
    # Guards the drafted path if the gate ever admits this: a revenue figure is pure invention.
    - '[€$£]\s?\d|\b\d+([.,]\d+)?\s?(million|billion|EUR|USD|GBP)\b'
