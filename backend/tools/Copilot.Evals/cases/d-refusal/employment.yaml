# Hiring is not a support topic and no policy document covers it, so this declines before the
# model is called. The figure guard matters because a salary range is the specific an invented
# answer would carry, and it would read entirely plausibly.
id: d-employment
class: refusal
fixture: refusal-employment.json
market: GLOBAL
expect:
  must_be: insufficient_data
  no_model_call: true
  must_not_match:
    - '[€$£]\s?\d|\b\d+([.,]\d+)?\s?(k|EUR|USD|GBP)\b'
# Bad drafts the banned-text assertions must flag; the audit fails the run if one cannot.
must_flag:
  - "The salary range for that role is 55k to 70k depending on experience."
