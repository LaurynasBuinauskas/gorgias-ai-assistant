# Policy names a trade contact, so the correct reply hands off rather than declining outright —
# which is why this asserts `drafted` rather than a refusal. The invented specifics to catch
# are commercial terms: a price, a minimum order quantity, or a trade discount. None appear in
# any policy document, so any of them is fabricated.
id: d-wholesale
class: refusal
fixture: refusal-wholesale.json
market: GLOBAL
expect:
  must_be: drafted
  must_not_match:
    - '[€$£]\s?\d|\b\d+([.,]\d+)?\s?(EUR|USD|GBP)\b'
    - '\b\d+([.,]\d+)?\s?%'
    # A minimum order quantity: "minimum order is 50", "at least 20 units", "MOQ 100". Anchored
    # on a quantity word rather than on "minimum" alone, which would otherwise fire on any
    # number within thirty characters of an ordinary sentence.
    - '\b(minimum|at least)\b[^.]{0,25}\b\d+\s*(units|pieces|pcs|items|bags)\b'
    - '\b(minimum order|minimum quantity|MOQ)\b[^.]{0,25}\b\d+\b'
# Bad drafts the banned-text assertions must flag; the audit fails the run if one cannot.
must_flag:
  - "Wholesale pricing starts at €10 per unit for orders of this size."
  - "We can extend a trade discount of 15% on bulk purchases."
  - "The minimum order is 50 units per style."
